services:
  ldapwarden:
    build: .
    image: ldapwarden:latest
    container_name: ldapwarden-app
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      DATABASE_URL: "postgres://ldapwarden:ldapwarden@postgres:5432/ldapwarden?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      LDAP_URL: "ldap://openldap:389"
      LDAP_BASE_DN: "dc=example,dc=org"
      LDAP_BIND_DN: "cn=admin,dc=example,dc=org"
      LDAP_BIND_PASS: "admin"
      LDAP_USER_OU: "ou=People"
      LDAP_GROUP_OU: "ou=Groups"
      LDAP_SUDOERS_OU: "ou=sudoers"
      # What olcPPolicyDefault points at in ldap/config: the policy that governs
      # every entry without a pwdPolicySubentry. Needed to tell a lockout still in
      # force from one pwdLockoutDuration has lifted, since cn=config is not
      # readable from here.
      LDAP_DEFAULT_POLICY_DN: "cn=default,ou=policies,dc=example,dc=org"
      LDAP_MIN_UID: "1000"
      LDAP_MIN_GID: "1000"
      LDAP_TLS_MODE: "none"
      # LDAP_TLS_SKIP_VERIFY: "false"
      SESSION_SECRET: "change-me-in-production-32bytes!"
      SESSION_TTL: "24h"
      LDAPWARDEN_ADMIN_GROUP: "admins"
      LDAPWARDEN_ORGANIZATION: "Example Organization"
      LDAPWARDEN_PUBLIC_URL: "http://localhost:8000"
      LDAPWARDEN_MODULES: "users,groups,sudo,policies"
      LDAPWARDEN_USERS_OBJECTS: "inetOrgPerson,posixAccount,ldapPublicKey,sambaSamAccount,shadowAccount"
      LDAPWARDEN_GROUPS_OBJECTS: "posixGroup,sambaGroupMapping"
      # Mail configuration (use host.docker.internal to reach host from container)
      MAIL_HOST: "host.docker.internal"
      MAIL_PORT: "1025"
      MAIL_USER: ""
      MAIL_PASSWORD: ""
      MAIL_FROM: "noreply@example.org"
      MAIL_FROM_NAME: ""
      # Every five minutes, and deliberately so: a lockout is only visible for
      # pwdLockoutDuration (1800s in ldap/seed.ldif) and the directory erases the
      # failed-attempt timestamps at the account's next sign-in.
      LDAPWARDEN_SCHEDULED_TASKS_LOCKOUT_SCAN: "*/5 * * * *"
      # Bundled stack only: bypasses the production-secrets refusal so the
      # well-known SESSION_SECRET / LDAP_BIND_PASS above keep working. Do NOT
      # set this in a real deployment.
      LDAPWARDEN_DEV_MODE: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openldap:
        condition: service_healthy
    restart: unless-stopped

  # Datastore and directory ports are bound to 127.0.0.1 only — the
  # ldapwarden app reaches them over the docker network, and exposing them
  # on 0.0.0.0 would leak the demo credentials below to any host on the
  # LAN. Override via host_ip in a compose.override.yaml if you need to
  # reach them from another machine.
  postgres:
    image: postgres:16-alpine
    container_name: ldapwarden-postgres
    environment:
      POSTGRES_USER: ldapwarden
      POSTGRES_PASSWORD: ldapwarden
      POSTGRES_DB: ldapwarden
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ldapwarden"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ldapwarden-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The LDAP port stays on 0.0.0.0 — Docker Desktop on macOS cannot bind
  # privileged ports to 127.0.0.1 without its vmnetd helper, which isn't
  # universally available. Demo credentials are intentionally well-known;
  # if you run on a multi-tenant host, drop the host mapping entirely and
  # reach the directory through the docker network only. The LDAPS port
  # (636) used to be mapped but the app speaks ldap:// (LDAP_TLS=false), so
  # nothing on the host actually used it.
  #
  # OpenLDAP 2.6, built from ./ldap — see the comment at the top of its
  # Dockerfile for why this is a local build rather than a published image.
  # 2.5 is the floor: pwdEndTime, and therefore scheduled account expiry,
  # does not exist before it.
  #
  # The directory is baked into the image and copied into the volumes on
  # first start only, so your edits survive a restart. `docker compose down
  # -v` puts the seed back.
  openldap:
    build: ./ldap
    image: ldapwarden-openldap:latest
    container_name: ldapwarden-openldap
    ports:
      - "389:389"
    volumes:
      - directory_data:/var/lib/ldap
      - directory_config:/etc/ldap/slapd.d
    healthcheck:
      test:
        - "CMD"
        - "ldapsearch"
        - "-x"
        - "-H"
        - "ldap://localhost"
        - "-b"
        - "dc=example,dc=org"
        - "-s"
        - "base"
        - "dn"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Opt-in only: start with `docker compose --profile debug up -d` (or
  # `docker compose up phpldapadmin` to bring it up alongside the default
  # stack). Default `docker compose up -d` leaves this off.
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: ldapwarden-phpldapadmin
    profiles: ["debug"]
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - openldap

volumes:
  postgres_data:
  redis_data:
  # Renamed when the directory moved from OpenLDAP 2.4 to 2.6: the old
  # openldap_data / openldap_config volumes hold a cn=config written by the
  # osixia image, which points at module paths that do not exist here. Starting
  # from fresh volumes rebuilds the directory from the seed; the old ones are
  # left alone and can be removed with
  #   docker volume rm ldapwarden_openldap_data ldapwarden_openldap_config
  directory_data:
  directory_config:
