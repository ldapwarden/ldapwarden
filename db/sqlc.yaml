version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    # The migrations are the schema, and they live in the package the binary
    # embeds (internal/migrations) so there is only ever one copy of them.
    schema: "../internal/migrations"
    gen:
      go:
        package: "db"
        out: "../internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
