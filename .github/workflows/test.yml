name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Static analysis, no services required. Everything here was already available
  # locally (.golangci.yml, `make lint-go`) but nothing ran it on a push, so Go
  # was the only part of the tree CI never linted — the frontend job has run
  # `pnpm lint` all along.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # The integration tag too, otherwise the integration tests — the bulk of
      # the test suite — are never analysed.
      - name: Vet
        run: go vet -tags integration ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --build-tags=integration

      # The release stamps the version through -ldflags. A renamed symbol fails
      # silently there — the build succeeds and every release reports "dev" —
      # so the link path is exercised here instead.
      - name: Version stamp
        run: make version-stamp-check

      # govulncheck fetches the vulnerability database on every run, so this step
      # can turn red on a commit that has not changed — that is the point, but it
      # means a red build here may call for a Go patch bump rather than a code fix.
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      # --wait blocks until every service reports healthy, so the polling loops
      # this used to carry live in the compose file next to the services they
      # describe. The directory is built here rather than pulled (see
      # ldap/Dockerfile).
      - name: Start services
        run: docker compose up -d --wait postgres openldap

      - name: Run integration tests
        env:
          LDAPWARDEN_TEST_INTEGRATION: "1"
        run: go test -tags integration -race -count=1 -v ./...

      # Last, so it covers a directory that failed to come up *and* one that
      # came up but refused something the tests expected to work.
      - name: Dump directory logs on failure
        if: failure()
        run: docker logs ldapwarden-openldap

  # The frontend was only ever built at release time, so a type error or a lint
  # failure passed CI and only surfaced when cutting a tag. This job runs what
  # the release build runs (`pnpm build` is `tsc -b && vite build`), so a broken
  # frontend fails the PR instead.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Matches release.yml: pnpm 11 needs node:sqlite, and vite 8 requires
          # >=20.19 || >=22.12.
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: latest
          run_install: false

      - name: Install dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Lint
        run: cd web && pnpm lint

      - name: Unit tests
        run: cd web && pnpm test

      - name: Typecheck and build
        run: cd web && pnpm build
