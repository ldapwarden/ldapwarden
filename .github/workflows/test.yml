name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      # --wait blocks until every service reports healthy, so the polling loops
      # this used to carry live in the compose file next to the services they
      # describe. The directory is built here rather than pulled (see
      # ldap/Dockerfile).
      - name: Start services
        run: docker compose up -d --wait postgres redis openldap

      - name: Run integration tests
        env:
          LDAPWARDEN_TEST_INTEGRATION: "1"
        run: go test -tags integration -count=1 -v ./...

      # Last, so it covers a directory that failed to come up *and* one that
      # came up but refused something the tests expected to work.
      - name: Dump directory logs on failure
        if: failure()
        run: docker logs ldapwarden-openldap

  # The frontend was only ever built at release time, so a type error or a lint
  # failure passed CI and only surfaced when cutting a tag. This job runs what
  # the release build runs (`pnpm build` is `tsc -b && vite build`), so a broken
  # frontend fails the PR instead.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches release.yml: pnpm 11 needs node:sqlite, and vite 8 requires
          # >=20.19 || >=22.12.
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: latest
          run_install: false

      - name: Install dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Lint
        run: cd web && pnpm lint

      - name: Typecheck and build
        run: cd web && pnpm build

  # The embedded migrations (cmd/server/migrations, applied at startup) and the
  # ones the integration tests apply (db/migrations) are two copies of the same
  # files. Nothing but this check stops them from drifting — and a drift means
  # the tests pass against a schema the binary never creates.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Embedded and test migrations are identical
        run: diff -r db/migrations cmd/server/migrations
