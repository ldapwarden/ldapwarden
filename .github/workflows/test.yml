name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"

      - name: Start services
        run: docker compose up -d postgres redis openldap

      - name: Wait for services
        run: |
          until docker exec ldapwarden-postgres pg_isready -U ldapwarden > /dev/null 2>&1; do sleep 1; done
          until docker exec ldapwarden-redis redis-cli ping > /dev/null 2>&1; do sleep 1; done
          for i in $(seq 1 60); do
            if docker exec ldapwarden-openldap ldapsearch -x -D "cn=admin,dc=example,dc=org" -w admin -b "dc=example,dc=org" -s base -H ldap://localhost > /dev/null 2>&1; then
              echo "OpenLDAP ready"
              exit 0
            fi
            sleep 2
          done
          echo "OpenLDAP did not become ready"
          docker logs ldapwarden-openldap
          exit 1

      - name: Run integration tests
        env:
          LDAPWARDEN_TEST_INTEGRATION: "1"
        run: go test -tags integration -count=1 -v ./...

  # The frontend was only ever built at release time, so a type error or a lint
  # failure passed CI and only surfaced when cutting a tag. This job runs what
  # the release build runs (`pnpm build` is `tsc -b && vite build`), so a broken
  # frontend fails the PR instead.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Matches release.yml: pnpm 11 needs node:sqlite, and vite 8 requires
          # >=20.19 || >=22.12.
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: latest
          run_install: false

      - name: Install dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Lint
        run: cd web && pnpm lint

      - name: Typecheck and build
        run: cd web && pnpm build

  # The embedded migrations (cmd/server/migrations, applied at startup) and the
  # ones the integration tests apply (db/migrations) are two copies of the same
  # files. Nothing but this check stops them from drifting — and a drift means
  # the tests pass against a schema the binary never creates.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Embedded and test migrations are identical
        run: diff -r db/migrations cmd/server/migrations
