name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9][0-9][0-9]"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(date -u +'%Y.%m.%d.%H%M%S')" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          # Without it the runner's cached 1.26.x wins over a newer patch
          # release, and the binaries ship without stdlib fixes the cache predates.
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 24, not 20: pnpm 11 imports the node:sqlite built-in, which does
          # not exist on Node 20 (ERR_UNKNOWN_BUILTIN_MODULE), and vite 8
          # requires >=20.19 || >=22.12 anyway.
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest
          run_install: false

      - name: Build frontend
        run: cd web && pnpm install --frozen-lockfile && pnpm build

      # The version is stamped into the binary, so the running server reports it
      # rather than the UI reporting whatever it was built against.
      - name: Build Go binaries
        env:
          LDFLAGS: -w -s -X github.com/ldapwarden/ldapwarden/internal/buildinfo.Version=${{ steps.version.outputs.version }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o ldapwarden-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o ldapwarden-linux-arm64 ./cmd/server

      - name: Create and push tag
        if: github.ref_type != 'tag'
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      # CHANGELOG.md is a history; a release body is one entry of it. Take the
      # topmost section — everything between the first "## " heading and the next
      # — and title it with the version being released, so the body is right
      # whether the file still says "## Unreleased" or already carries a version.
      - name: Extract the release notes
        run: |
          {
            echo "## ${{ steps.version.outputs.version }}"
            echo
            awk '/^## /{if (seen) exit; seen=1; next} seen' CHANGELOG.md
          } > release-notes.md
          echo "--- release body ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          # Auto-generated notes are a commit list, which cannot tell an operator
          # that a release needs a migration run before it works. The changelog
          # section leads; the commit list follows underneath it.
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            ldapwarden-linux-amd64
            ldapwarden-linux-arm64

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/ldapwarden/ldapwarden:latest
            ghcr.io/ldapwarden/ldapwarden:${{ steps.version.outputs.version }}
